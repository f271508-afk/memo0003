const SHEET_NAME = "工作表1";
const DRIVE_FOLDER_NAME = "備忘錄照片";
function getOrCreateFolder(){let f=DriveApp.getFoldersByName(DRIVE_FOLDER_NAME);if(f.hasNext())return f.next();return DriveApp.createFolder(DRIVE_FOLDER_NAME);}
function normalizeImagesField(imgField){
  if(!imgField) return [];
  if(Array.isArray(imgField)) return imgField;
  if(typeof imgField === 'string'){
    try{
      let p = JSON.parse(imgField);
      if(Array.isArray(p)) return p;
      if(typeof p === 'string') return [p];
    }catch(e){
      return [imgField];
    }
  }
  return [];
}
function doGet(e){
  try{
    const ss=SpreadsheetApp.getActiveSpreadsheet();
    const s=ss.getSheetByName(SHEET_NAME)||ss.getActiveSheet();
    const d=s.getDataRange().getValues();
    if(d.length<=1) return ContentService.createTextOutput(JSON.stringify([])).setMimeType(ContentService.MimeType.JSON);
    const h=d[0];
    let r=[];
    for(let i=1;i<d.length;i++){
      let o={}; h.forEach((hh,idx)=>o[hh]=d[i][idx]);
      try{ o.images = normalizeImagesField(o.images); }catch(e){ o.images = []; }
      r.push(o);
    }
    return ContentService.createTextOutput(JSON.stringify(r)).setMimeType(ContentService.MimeType.JSON);
  }catch(err){
    return ContentService.createTextOutput(JSON.stringify({ok:false,error:err.message})).setMimeType(ContentService.MimeType.JSON);
  }
}
function doPost(e){
  try{
    const ss=SpreadsheetApp.getActiveSpreadsheet();
    const s=ss.getSheetByName(SHEET_NAME)||ss.getActiveSheet();
    if(s.getLastRow()===0) s.appendRow(['id','title','content','category','categoryColor','images','createdAt','updatedAt','isDone']);
    const p=JSON.parse(e.postData.contents);
    if(p.action==='clear'){
      s.clear(); s.appendRow(['id','title','content','category','categoryColor','images','createdAt','updatedAt','isDone']);
      return ContentService.createTextOutput(JSON.stringify({ok:true})).setMimeType(ContentService.MimeType.JSON);
